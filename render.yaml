# Render Blueprint: New > Blueprint in the Render dashboard, pick this repository.
# Render asks for each "sync: false" value when it creates the service. See DEPLOY.md.
# APP_URL (for links in emails) defaults to the address Render gives the site; set it for your own domain.
services:
  - type: web
    name: triplet
    # Render's free build machine runs out of memory bundling the website, so GitHub Actions builds
    # the image (.github/workflows/deploy.yml) and Render only runs it
    runtime: image
    image:
      url: ghcr.io/uwuexdeemeow/triplet:latest
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_PATH_PREFIX
        value: /api
      # Render's load balancer adds the visitor's address to X-Forwarded-For
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Postgres connection string, e.g. from Neon: postgresql+psycopg://user:password@host/db?sslmode=require
      - key: DB_SETTINGS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Render's free plan blocks email ports, so email goes through Brevo's API over HTTPS
      - key: BREVO_API_KEY
        sync: false
      # The sender, e.g. Triplet <you@example.com>: an address verified in Brevo
      - key: SMTP_FROM
        sync: false
