<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover tells Safari to report the iPhone's safe areas (env(safe-area-inset-*)),
         which the app reads to keep the tab bar clear of the home indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Expo's default page, with one change: the app is as tall as what's visible. -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height. In iOS Safari, 100% includes the part
         behind the address bar when it sits at the bottom, which cut the tab bar off; 100dvh is
         only what's visible, and follows the bar as it shows and hides. */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        height: var(--visible-height, 100dvh);
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // iOS Safari's bottom address bar floats over the page, and 100dvh still counts the part
      // behind it, so the tab bar and the end of forms (their Save buttons) were hidden under it.
      // The visual viewport is only what can be seen, so the app is sized to that instead.
      (function () {
        var viewport = window.visualViewport;
        if (!viewport) return;
        function update() {
          // Pinch-zooming shrinks the visual viewport too; the app shouldn't shrink with it
          if (viewport.scale > 1.01) return;
          // Down to where the visible area ends: if Safari has scrolled the page (say for the
          // keyboard), the part above it still counts
          var height = viewport.height + Math.max(0, viewport.offsetTop);
          document.documentElement.style.setProperty('--visible-height', Math.round(height) + 'px');
        }
        update();
        viewport.addEventListener('resize', update);
        viewport.addEventListener('scroll', update);
      })();
    </script>
  </body>
</html>
